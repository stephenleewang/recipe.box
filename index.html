<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d8452b">
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE warm, practical kitchen tool, no fuss
   IDEA a recipe card box: each recipe an index card, cook mode one big card per step
   PICTURE the cards themselves; photo or a lettered tile
   COLOUR white ground, ink, tomato red leads, butter yellow support
   TYPE Fraunces for titles, Instrument Sans for everything else
   LAYOUT tomato band with search, card grid, detail as one reading column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#15110e);--card:light-dark(#ffffff,#201a16);--soft:light-dark(#f7f2ed,#2a221d);--ink:light-dark(#1d1916,#f4ede5);--mute:light-dark(#6c625a,#b4a99e);--line:light-dark(#e8dfd6,#3a3029);--tom:#d8452b;--tomt:light-dark(#b8361f,#ff7a5f);--but:#f6c945;--sh:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(60,30,10,.08)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;line-height:1.08;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--but);outline-offset:2px}
.top{background:var(--tom);color:#fff;padding:22px max(5vw,16px) 20px}
.top .row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.top h1{font-size:clamp(30px,6vw,44px);flex:1}
.top h1 small{display:block;font:500 14px "Instrument Sans",sans-serif;opacity:.85;margin-top:4px}
.search{max-width:1100px;margin:16px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 220px;height:46px;border-radius:12px;border:0;padding:0 14px;font-size:16px;background:#fff;color:#1d1916}
.chip{height:38px;padding:0 14px;border-radius:99px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:#fff;color:var(--tom);border-color:#fff}
.chips{display:flex;gap:8px;max-width:1100px;margin:12px auto 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chip{flex:none}
.fl{display:flex;gap:8px;max-width:1100px;margin:10px auto 0}
.fl select{flex:1;height:40px;border-radius:10px;border:0;padding:0 10px;font-size:15px;background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.fl select option{color:#1d1916}
.top[hidden]{display:none}
.top .row .btn{flex:none}.b-wline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7);text-decoration:none}
.hero{position:relative}.hbtn{position:absolute;right:12px;bottom:12px;height:40px;padding:0 14px;border-radius:10px;border:0;background:rgba(20,10,5,.6);color:#fff;font-weight:600;backdrop-filter:blur(4px)}
.ings li.ir{display:flex;align-items:center;gap:8px}.ings li.ir label{flex:1}
.ad{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;font-size:20px;font-weight:600;color:var(--tomt);line-height:1}
.ad.on{background:var(--tom);border-color:var(--tom);color:#fff;font-size:16px}
.slink{display:inline-flex;align-items:center;margin-top:12px;color:var(--tomt);font-weight:600;text-decoration:none;height:44px}
.for{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.sadd{display:flex;gap:8px;margin:18px 0 22px}.sadd input{flex:1}
.dv h2 a{color:inherit;text-decoration:none}
.top h1 a{color:inherit;text-decoration:none}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft)}.pill.cu{background:var(--but);color:#1d1916}
.myrate{display:flex;align-items:center;gap:0;margin-top:10px}.myrate button{width:40px;height:44px;border:0;background:none;font-size:28px;color:var(--line);padding:0}.myrate button.on{color:var(--tom)}.myrate span{font-size:14px;color:var(--mute);margin-left:8px}
.rb .st{color:var(--tomt);font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:8px}.cats button{height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:none;font-weight:600;font-size:14px}
.cats button[aria-pressed=true]{background:var(--tom);border-color:var(--tom);color:#fff}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b-main{background:var(--tom);color:#fff}.b-light{background:#fff;color:var(--tom)}
.b-ghost{background:var(--soft);color:var(--ink)}.b-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b-danger{background:transparent;color:var(--tomt);border:1.5px solid currentColor}
main{max-width:1100px;margin:0 auto;padding:22px max(5vw,16px) 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.rc{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--sh);transition:transform .15s}
.rc:active{transform:scale(.98)}
.thumb{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tile{width:100%;height:100%;display:grid;place-items:center;font:650 64px Fraunces,serif;color:#fff}
.rb{padding:12px 14px 14px}.rb h3{font-size:19px}.rb p{margin:6px 0 0;color:var(--mute);font-size:14px}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}.empty h2{color:var(--ink);font-size:28px;margin-bottom:8px}
.note{font-size:14px;color:var(--mute);margin:0 0 14px}
/* detail */
.dv{max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tomt);font-weight:600;text-decoration:none;height:44px}
.hero{border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--soft);margin:6px 0 18px}
.hero img{width:100%;height:100%;object-fit:cover}
.dv h1{font-size:clamp(32px,7vw,48px)}
.src{display:inline-block;margin-top:8px;color:var(--tomt);font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.mt{background:var(--soft);border-radius:12px;padding:8px 14px}.mt b{display:block;font-size:17px;white-space:nowrap}.mt span{font-size:13px;color:var(--mute)}
.serv{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.serv button{width:44px;height:44px;border:0;border-radius:10px;background:var(--card);font-size:22px;font-weight:600}
.serv div{text-align:center;padding:0 10px}.serv b{display:block;font-size:17px}.serv span{font-size:13px;color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.acts .b-main{flex:1 1 200px;height:52px;font-size:17px}
section{margin:0 0 30px}section h2{font-size:26px;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
section h2 small{font:500 14px "Instrument Sans",sans-serif;color:var(--mute)}
.ings{list-style:none;padding:0;margin:0}
.ings li{border-bottom:1px solid var(--line)}
.ings label{display:flex;gap:12px;padding:11px 2px;align-items:flex-start;cursor:pointer}
.ings input{width:22px;height:22px;accent-color:var(--tom);margin-top:2px;flex:none}
.ings .q{font-weight:600;white-space:nowrap}
.ings input:checked~span{text-decoration:line-through;color:var(--mute)}
.ings .hd{font-weight:600;padding:16px 0 4px;border:0;color:var(--tomt)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s}
.steps button{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;align-items:flex-start}
.steps button::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--but);color:#1d1916;font-weight:700;display:grid;place-items:center}
textarea,input[type=text],input[type=url],input[type=number],input[type=date],select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:11px 12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,110px),1fr));gap:8px}
.photos button{aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--soft)}
.photos img{width:100%;height:100%;object-fit:cover}
.addph{border:2px dashed var(--line)!important;color:var(--mute);font-weight:600;font-size:14px}
.log{list-style:none;padding:0;margin:0 0 12px}
.log li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.log .d{font-weight:600;white-space:nowrap;min-width:5.5em}.log .k{font-size:13px;color:var(--mute)}
.log .x{margin-left:auto;border:0;background:none;color:var(--mute);width:44px;height:44px;flex:none;font-size:20px}
.stars{color:var(--tom);letter-spacing:2px}
.saved{font-size:13px;color:var(--mute);min-height:20px;margin-top:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,10,5,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(4vw,16px) 28px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:26px;margin-bottom:6px}
.fld{margin:14px 0}.fld>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}.fld small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sbar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.tabs button{flex:1;height:40px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--card);box-shadow:var(--sh)}
.drop{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.drop img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.rate{display:flex;gap:2px}.rate button{width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--line)}.rate button.on{color:var(--tom)}
.seg{display:flex;gap:8px}.seg button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:none;font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--tom);background:var(--tom);color:#fff}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* cook mode */
.cook{position:fixed;inset:0;background:var(--tom);color:#fff;z-index:30;display:none;flex-direction:column}
.cook.on{display:flex}
.ctop{display:flex;align-items:center;gap:8px;padding:12px 14px}
.ctop b{flex:1;text-align:center;font-size:15px}
.cbtn{height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.prog{display:flex;gap:4px;padding:0 14px}.prog button{flex:1;height:8px;border:0;border-radius:4px;background:rgba(255,255,255,.3);padding:0}
.prog button.on{background:#fff}
.ccard{flex:1;margin:16px 14px;background:var(--bg);color:var(--ink);border-radius:22px;padding:clamp(22px,5vw,44px);display:flex;flex-direction:column;overflow:auto;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.ccard .n{font:650 18px Fraunces,serif;color:var(--tomt)}
.ccard p{font-size:clamp(22px,5.4vw,32px);line-height:1.35;margin:12px 0 0;flex:1}
.ccard .hint{font-size:13px;color:var(--mute);margin-top:16px}
.ccard .used{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--mute)}
.cnav{display:flex;gap:10px;padding:0 14px 18px}
.cnav button{flex:1;height:60px;border-radius:16px;border:0;font-size:18px;font-weight:600}
.cnav .pv{background:rgba(255,255,255,.18);color:#fff;flex:0 0 32%}.cnav .nx{background:#fff;color:var(--tom)}
.cing{position:absolute;inset:auto 0 0 0;max-height:70vh;overflow:auto;background:var(--bg);color:var(--ink);border-radius:20px 20px 0 0;padding:18px 18px 28px;transform:translateY(100%);transition:transform .25s}
.cing.on{transform:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:40;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.lb img{width:100%;border-radius:14px;max-height:60vh;object-fit:contain;background:var(--soft)}
@media(max-width:600px){.two{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rb h3{font-size:16px}.rb p{font-size:13px}.tile{font-size:48px}}
.top{padding-top:calc(22px + env(safe-area-inset-top))}
.top[hidden]+main{padding-top:calc(16px + env(safe-area-inset-top))}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.cook{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.toast{bottom:calc(22px + env(safe-area-inset-bottom))}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header class="top">
  <div class="row"><h1><a href="#all">Recipe Box</a><small id="count">Loading your recipes…</small></h1><a class="btn b-wline" href="#shopping" id="shopBtn">List</a><button class="btn b-light" id="addBtn">+ Add</button></div>
  <div class="search"><input id="q" type="search" placeholder="Search recipes, ingredients, cuisines" aria-label="Search recipes"></div>
  <div class="chips" id="chips"></div>
  <div class="fl"><select id="fcu" aria-label="Cuisine"><option value="">All cuisines</option></select></div>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="cook" id="cook"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="phIn" accept="image/*" multiple hidden>
<input type="file" id="rsIn" accept=".json,application/json" hidden>
<script>
{
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let ASSETS=null,R={},loaded=false,local=true,cat='',cui='',status='',cur=null,serv=0,checked=new Set(),cookI=0;
let SHOP={items:[]},phMode='add';
function saveShop(){SHOP={...SHOP,updated:Date.now()};IDB.setMeta('shop',JSON.parse(JSON.stringify(SHOP))).catch(()=>toast('Could not save the list'))}
const inShop=(rid,n)=>(SHOP.items||[]).find(x=>x.r===rid&&x.ix===n);
function shopCount(){const n=(SHOP.items||[]).filter(x=>!x.done).length;$('#shopBtn').textContent=n?'List · '+n:'List'}
const CATS=['Dinner','Lunch','Breakfast','App/Snack','Side','Sandwich','Sauce','Dessert','Drink'];
const CUIS=['American','Southern','Creole/Cajun','Mexican','Italian','Japanese','Chinese','Korean','Thai','Vietnamese','Indian','Mediterranean','Caribbean','French'];
function drawFilters(){
  const all=Object.values(R),have=new Set(all.flatMap(r=>r.cats||[]));
  if(cat&&!have.has(cat))cat='';
  $('#chips').innerHTML=['',...CATS.filter(c=>have.has(c))].map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${cat===c}">${esc(c||'All')}</button>`).join('');
  const cus=[...new Set(all.map(r=>r.cuisine).filter(Boolean))].sort();if(cui&&!cus.includes(cui))cui='';
  $('#fcu').innerHTML='<option value="">All cuisines</option>'+cus.map(c=>`<option ${c===cui?'selected':''}>${esc(c)}</option>`).join('');
}
const TILES=['#d8452b','#e0892a','#5b8c3a','#2f6f8f','#8a4f9e','#c2375f','#3d7d6b'];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- storage (IndexedDB on this device) ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const q=indexedDB.open('recipebox',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('recipes'))d.createObjectStore('recipes',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta')};q.onsuccess=()=>{IDB.db=q.result;res()};q.onerror=()=>rej(q.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(){return IDB.req('recipes','readonly',s=>s.getAll())},
  get(k){return IDB.req('meta','readonly',s=>s.get(k))},
  put(r){return IDB.req('recipes','readwrite',s=>s.put(r))},
  del(id){return IDB.req('recipes','readwrite',s=>s.delete(id))},
  setMeta(k,v){return IDB.req('meta','readwrite',s=>s.put(v,k))}};
function persist(r){r.updated=Date.now();R[r.id]=r;return IDB.put(JSON.parse(JSON.stringify(r))).catch(()=>toast('Could not save on this phone'))}
function remove(id){delete R[id];IDB.del(id).catch(()=>toast('Could not delete'))}
const toDataURL=b=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)});
async function init(){
  try{
    await IDB.open();
    if(!(await IDB.get('seeded'))){
      try{const sd=await (await fetch('/seed.json',{cache:'no-store'})).json();for(const r of sd.recipes||[])await IDB.put(r);if(sd.shop)await IDB.setMeta('shop',sd.shop);await IDB.setMeta('seeded',true)}catch(e){}
    }
    (await IDB.all()).forEach(r=>R[r.id]=r);
    SHOP=(await IDB.get('shop'))||{items:[]};if(!SHOP.items)SHOP.items=[];
  }catch(e){toast('This browser blocked storage')}
  loaded=true;render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
async function backup(){
  const data=JSON.stringify({app:'recipe-box',exported:new Date().toISOString(),recipes:Object.values(R),shop:SHOP});
  const name='recipe-box-backup-'+today()+'.json',file=new File([data],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Recipe Box backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('#rsIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(err){toast("That file isn't a Recipe Box backup");return}
  const rs=(d.recipes||[]).filter(r=>r&&r.id&&r.title);if(!rs.length){toast('No recipes found in that file');return}
  ask('Restore '+rs.length+' recipe'+(rs.length>1?'s':'')+'? Matching recipes will be replaced.','Restore',async()=>{
    for(const r of rs){R[r.id]=r;await IDB.put(r)}
    if(d.shop&&d.shop.items){SHOP=d.shop;await IDB.setMeta('shop',SHOP)}
    render();toast('Restored '+rs.length+' recipes');

async function openImported(j,u){

async function doImport(){
  const g=$('#go'),u=($('#iu').value||'').trim();imp.url=u;
  if(!/^https?:\/\//i.test(u)){toast('Paste a full link starting with http');return}
  if(!navigator.onLine){toast("You're offline. Importing needs a connection.");return}
  g.disabled=true;g.innerHTML='<span class="spin"></span> Reading…';
  try{
    const res=await fetch('/api/recipe?url='+encodeURIComponent(u));
    const j=await res.json().catch(()=>({error:res.status===404?'nofn':'fail'}));
    if(!res.ok||!j.title)throw new Error(j.error||'fail');
    await openImported(j,u);
  }catch(e){
    const m=e.message;
    if(m==='blocked'){imp.tab='paste';drawAdd("That site blocks link imports. Use your Copy recipe bookmark on the page, then paste here.");return}
    toast(m==='norecipe'?"Couldn't find a recipe on that page. Try Paste.":m==='nofn'?"Link import isn't set up on this deploy yet. See the README.":"Couldn't read that link. Try Paste.");
    g.disabled=false;g.textContent='Import';
  }
}
function parseText(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const find=(re,from)=>{for(let i=from||0;i<lines.length;i++)if(re.test(lines[i]))return i;return -1};
  const iI=find(/^ingredients\b/i);if(iI<0)return null;
  const iS=find(/^(instructions|directions|method|steps|preparation)\b/i,iI+1);if(iS<0)return null;
  const iE=find(/^(notes?|recipe notes|nutrition|video|tips|equipment|did you make)\b/i,iS+1);
  const title=lines.slice(0,iI).find(l=>l.length>3&&l.length<90&&!/^(jump|print|save|pin|rate|prep|cook|total|servings|serves|yield|course|cuisine|author|calories)/i.test(l))||'Pasted recipe';
  const ings=lines.slice(iI+1,iS).map(l=>l.replace(/^[▢□•\-*]\s*/,'')).filter(l=>l&&l.length<160);
  const steps=lines.slice(iS+1,iE>0?iE:undefined).map(l=>l.replace(/^(step\s*)?\d+[.):]?\s+/i,'')).filter(l=>l.length>8);
  const time=re=>{const m=txt.match(re);if(!m)return 0;const h=/(\d+)\s*h/i.exec(m[1]),mi=/(\d+)\s*m/i.exec(m[1]);return(h?+h[1]*60:0)+(mi?+mi[1]:0)};
  return{title,servings:+((txt.match(/(?:servings|serves|yield)\s*:?\s*(\d+)/i)||[])[1])||'',prep:time(/prep(?:\s*time)?\s*:?\s*((?:\d+\s*(?:hours?|hrs?|h|minutes?|mins?|m)\s*)+)/i),cook:time(/cook(?:\s*time)?\s*:?\s*((?:\d+\s*(?:hours?|hrs?|h|minutes?|mins?|m)\s*)+)/i),total:time(/total(?:\s*time)?\s*:?\s*((?:\d+\s*(?:hours?|hrs?|h|minutes?|mins?|m)\s*)+)/i),ingredients:ings,steps};
}
async function doPaste(){
  const g=$('#go'),txt=($('#it').value||'').trim();
  if(!txt){toast('Paste something first');return}
  let data=null;try{data=JSON.parse(txt)}catch(e){}
  if(data&&typeof data==='object'){
    if(!navigator.onLine){toast("You're offline. This needs a connection.");return}
    const body=data.recipeBox?data:{recipe:data};
    g.disabled=true;g.innerHTML='<span class="spin"></span> Reading…';
    try{
      const res=await fetch('/api/recipe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      const j=await res.json().catch(()=>({}));
      if(!res.ok||!j.title)throw new Error(j.error||'fail');
      return openImported(j,body.url||'');
    }catch(e){toast(e.message==='norecipe'?"That doesn't look like a recipe.":"Couldn't read that. Try again.");g.disabled=false;g.textContent='Add';return}
  }
  const p=parseText(txt);
  if(!p||(!p.ingredients.length&&!p.steps.length)){toast("Couldn't find Ingredients and Instructions in that text");return}
  const u=(txt.match(/https?:\/\/\S+/)||[])[0]||'';
  openImported(p,u);
}

async function shrink(file,max){
  try{const b=await createImageBitmap(file);const s=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(x=>res(x||file),'image/jpeg',.85))}catch(e){return file}
}

/* ---------- cook mode ---------- */
let wake=null;
function cookOpen(i){cookI=i;$('#cook').classList.add('on');document.body.style.overflow='hidden';cookRender();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w,()=>{})}catch(e){}}
function cookClose(){$('#cook').classList.remove('on');document.body.style.overflow='';try{wake&&wake.release()}catch(e){}wake=null}
function cookRender(){
  const r=R[cur];if(!r)return cookClose();const st=r.steps||[],n=st.length,s=st[cookI]||'';
  const base=+r.servings||0,k=base&&serv?serv/base:1;
  const words=s.toLowerCase();
  const used=(r.ings||[]).filter(i=>!i.h).filter(i=>{const w=i.t.toLowerCase().replace(/\(.*?\)/g,'').split(/[\s,]+/).filter(x=>x.length>3&&!/^(cups?|tbsp|tsp|tablespoons?|teaspoons?|ounces?|pounds?|grams?|large|small|medium|fresh|chopped|minced|sliced|diced|finely|ground)$/.test(x));return w.some(x=>words.includes(x.replace(/s$/,'')))});
  $('#cook').innerHTML=`<div class="ctop"><button class="cbtn" id="cx" aria-label="Close">✕</button><b>${esc(r.title)}</b><button class="cbtn" id="ci">Ingredients</button></div>
  <div class="prog">${st.map((_,j)=>`<button class="${j<=cookI?'on':''}" data-go="${j}" aria-label="Step ${j+1}"></button>`).join('')}</div>
  <div class="ccard" id="cc"><div class="n">Step ${cookI+1} of ${n}</div><p>${esc(s)}</p>${used.length?`<div class="used">Uses: ${used.map(i=>esc((i.q!=null?qty(i,k)+' ':'')+i.t)).join(' · ')}</div>`:''}<div class="hint">Tap the card for the next step</div></div>
  <div class="cnav"><button class="pv" id="cp" ${cookI?'':'disabled style="opacity:.4"'}>Back</button><button class="nx" id="cn">${cookI<n-1?'Next step':'Done'}</button></div>
  <div class="cing" id="cig"><h2 style="font-size:24px;margin-bottom:8px">Ingredients${base&&serv!==base?' <small style="font:500 14px Instrument Sans">for '+fmt(serv)+'</small>':''}</h2><ul class="ings">${(r.ings||[]).map((i,j)=>i.h?`<li class="hd">${esc(i.t)}</li>`:`<li><label><input type="checkbox" data-ck="${j}" ${checked.has(j)?'checked':''}><span>${i.q!=null?`<span class="q">${esc(qty(i,k))}</span> `:''}${esc(i.t)}</span></label></li>`).join('')}</ul><button class="btn b-main" style="width:100%;margin-top:14px" id="cic">Back to step</button></div>`;
  const next=()=>{if(cookI<n-1){cookI++;cookRender()}else{cookClose();logSheet(true)}};
  $('#cx').onclick=cookClose;$('#cn').onclick=next;$('#cc').onclick=next;
  $('#cp').onclick=()=>{if(cookI>0){cookI--;cookRender()}};
  $('#ci').onclick=()=>$('#cig').classList.add('on');$('#cic').onclick=()=>$('#cig').classList.remove('on');
  $('#cook').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cookI=+b.dataset.go;cookRender()});
  let x0=null;const cc=$('#cc');cc.ontouchstart=e=>x0=e.touches[0].clientX;cc.ontouchend=e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx>60&&cookI>0){e.preventDefault();cookI--;cookRender()}else if(dx<-60){e.preventDefault();next()}};
}

function saveNotes(){const el=$('#notes'),r=R[cur];if(!el||!r)return;if((r.notes||'')!==el.value){const n={...r,notes:el.value};persist(n).then(()=>{const s=$('#nsaved');if(s)s.textContent='Saved'})}else{const s=$('#nsaved');if(s)s.textContent=''}}
$('#addBtn').onclick=addSheet;
$('#q').addEventListener('input',()=>{if(cur)location.hash='all';list()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;list()});
$('#fcu').addEventListener('change',e=>{cui=e.target.value;list()});
render();init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
